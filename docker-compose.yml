services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: movietickets
      POSTGRES_PASSWORD: movietickets
      POSTGRES_DB: movietickets
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movietickets"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Containerized app, for testing the whole stack without installing
  # Node/pnpm locally (e.g. on Windows, or just to try it out quickly).
  # Not started by default — `docker compose up -d` alone only brings up
  # infra, so day-to-day dev keeps using `pnpm dev:api` with hot reload.
  # Start it with: docker compose --profile full up -d
  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://movietickets:movietickets@postgres:5432/movietickets
      JWT_SECRET: dev-secret
      JWT_EXPIRES_IN: 1h
      PORT: 3000
      LOG_LEVEL: info
    ports:
      - "3000:3000"

volumes:
  postgres_data:
