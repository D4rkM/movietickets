services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: movietickets
      POSTGRES_PASSWORD: movietickets
      POSTGRES_DB: movietickets
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movietickets"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Fake SMTP server for local dev: NotificationModule sends purchase-confirmation
  # emails here via nodemailer instead of a real provider. Web UI at
  # http://localhost:8025 shows every message caught — nothing leaves the
  # local network. See docs/planning.md's "Stack" section.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  # Containerized app (api + web), for testing the whole stack without
  # installing Node/pnpm locally (e.g. on Windows, or just to try it out
  # quickly). Not started by default — `docker compose up -d` alone only
  # brings up infra, so day-to-day dev keeps using `pnpm dev:api`/`dev:web`
  # with hot reload. Start both with: docker compose --profile full up -d
  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      DATABASE_URL: postgres://movietickets:movietickets@postgres:5432/movietickets
      VALKEY_URL: redis://valkey:6379
      JWT_SECRET: dev-secret
      JWT_EXPIRES_IN: 1h
      PORT: 3000
      LOG_LEVEL: info
      CORS_ORIGIN: http://localhost:5173
      WEB_URL: http://localhost:5173
      PUBLIC_API_URL: http://localhost:3000
      # Required, no default — getOrThrow crashes the app at boot without it.
      # Export it in your shell (or a root .env, gitignored) before `docker
      # compose --profile full up`; get a sandbox value from the Mercado
      # Pago developer dashboard.
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:?set MERCADOPAGO_ACCESS_TOKEN before starting the api/full profile}
      # "mailpit", not "localhost" — this container doesn't share the host's
      # network namespace, so it reaches Mailpit through compose's own DNS.
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_FROM: MovieTickets <no-reply@movietickets.local>
    ports:
      - "3000:3000"

  # Drizzle Studio (DB browser UI), pointed at the same Postgres as `api`.
  # Access it at https://local.drizzle.studio (it talks to the local server
  # below over the published port — the studio UI itself is static, hosted
  # by Drizzle, not served by this container).
  studio:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: studio
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://movietickets:movietickets@postgres:5432/movietickets
    ports:
      - "4983:4983"

  # Published on host port 5173 (same as `pnpm dev:web`'s Vite default) so it
  # lines up with the API's CORS_ORIGIN default (http://localhost:5173) with
  # no extra config. `VITE_API_URL` isn't set here on purpose: it's a
  # build-time-only Vite env var, and the app's built-in default
  # (http://localhost:3000) already matches the api service's published port
  # — the browser (on the host) talks to both containers via their published
  # ports, not the compose-internal network.
  web:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:5173"

volumes:
  postgres_data:
