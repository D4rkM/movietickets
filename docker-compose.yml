services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: movietickets
      POSTGRES_PASSWORD: movietickets
      POSTGRES_DB: movietickets
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movietickets"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Fake SMTP server for local dev: NotificationModule sends purchase-confirmation
  # emails here via nodemailer instead of a real provider. Web UI at
  # http://localhost:8025 shows every message caught — nothing leaves the
  # local network. See docs/planning.md's "Stack" section.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  # Containerized app (api + web), for testing the whole stack without
  # installing Node/pnpm locally (e.g. on Windows, or just to try it out
  # quickly). Not started by default — `docker compose up -d` alone only
  # brings up infra, so day-to-day dev keeps using `pnpm dev:api`/`dev:web`
  # with hot reload. Start both with: docker compose --profile full up -d
  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      mailpit:
        condition: service_started
    # Loads apps/api/.env (same file `pnpm dev:api` uses) into the container's
    # runtime environment — this is a compose-level, runtime-only mechanism
    # (unlike build ARGs, it never touches the image itself, so it doesn't
    # conflict with .dockerignore excluding .env from the build context). Only
    # fills in keys not already set below: MERCADOPAGO_ACCESS_TOKEN comes from
    # here, while every explicit `environment` entry (DATABASE_URL, WEB_URL,
    # etc.) keeps overriding apps/api/.env's host-oriented values (localhost,
    # ngrok URLs meant for the browser) with the container-correct ones.
    env_file:
      - apps/api/.env
    environment:
      DATABASE_URL: postgres://movietickets:movietickets@postgres:5432/movietickets
      VALKEY_URL: redis://valkey:6379
      JWT_SECRET: dev-secret
      JWT_EXPIRES_IN: 1h
      PORT: 3000
      LOG_LEVEL: info
      CORS_ORIGIN: http://localhost:5173
      WEB_URL: http://localhost:5173
      PUBLIC_API_URL: http://localhost:3000
      # "mailpit", not "localhost" — this container doesn't share the host's
      # network namespace, so it reaches Mailpit through compose's own DNS.
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_FROM: MovieTickets <no-reply@movietickets.local>
    ports:
      - "3000:3000"

  # Drizzle Studio (DB browser UI), pointed at the same Postgres as `api`.
  # Access it at https://local.drizzle.studio (it talks to the local server
  # below over the published port — the studio UI itself is static, hosted
  # by Drizzle, not served by this container).
  studio:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: studio
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://movietickets:movietickets@postgres:5432/movietickets
    ports:
      - "4983:4983"

  # Published on host port 5173 (same as `pnpm dev:web`'s Vite default) so it
  # lines up with the API's CORS_ORIGIN default (http://localhost:5173) with
  # no extra config — the browser (on the host) talks to both containers via
  # their published ports, not the compose-internal network.
  web:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # VITE_API_URL is a build-time-only Vite env var — `.env` files are
        # dockerignored on purpose (don't bake env files into images), so
        # `apps/web/.env` is invisible in here and must come in as a build
        # arg instead. Defaults to the api service's published port for
        # plain `make up-full`; export VITE_API_URL (e.g. to the api's ngrok
        # tunnel URL) before `--build` to test through ngrok.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:5173"

volumes:
  postgres_data:
